name: "Bot de Notícias - Drones de Pulverização"
version: "1.3.1"
slug: "bot_noticias"
description: "Coleta notícias de drones de pulverização (Brasil e mundo), traduz e reescreve no tom do canal, e publica no canal do WhatsApp depois da sua aprovação."
startup: application
boot: auto
init: false
arch:
  - aarch64

# O painel do bot aparece dentro do Home Assistant (sem digitar IP nenhum).
ingress: true
ingress_port: 8090
panel_icon: mdi:newspaper-variant
panel_title: Bot de Notícias
panel_admin: true

options:
  canal_id: ""
  canais: ""
  modo_publicacao: "reserva"
  meu_numero: ""
  painel_porta: "8090"
  llm_provedor: "groq"
  groq_api_key: ""
  groq_modelo: "qwen/qwen3.8-27b"
  resumo_diario_hora: "07:00"
  max_noticias: 5
  painel_token: ""
  notificar_ha: "true"
  dispositivo_notificacao: ""
  publicar_estado_ha: "true"
schema:
  canal_id: str?
  canais: str?
  modo_publicacao: "list(reserva|todos)"
  meu_numero: str?
  painel_porta: port?
  llm_provedor: "list(groq|ha_assist|ollama|heuristica)"
  groq_api_key: str?
  groq_modelo: str?
  resumo_diario_hora: str?
  max_noticias: int(1,20)?
  painel_token: password?
  notificar_ha: bool?
  dispositivo_notificacao: str?
  publicar_estado_ha: bool?
ports:
  8090/tcp: 8090
map:
  - share:rw
# Dá acesso à API do Home Assistant (via http://supervisor/core/api) e
# injeta a variável SUPERVISOR_TOKEN no container. É a chave que existe em
# todas as versões do Supervisor — a mais nova ("homeassistant_api") só
# apareceu em 2026.05.
hassio_api: true
