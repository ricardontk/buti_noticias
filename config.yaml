name: "Bot de Notícias - Drones de Pulverização"
version: "1.6.2"
slug: "bot_noticias"
description: "Coleta notícias de drones de pulverização (Brasil e mundo), traduz e reescreve no tom do canal, e publica no canal do WhatsApp depois da sua aprovação."
startup: application
boot: auto
init: false
arch:
  - aarch64

# ---------------------------------------------------------------------------
# PORTAS — o número é um só: 8090. Ele aparece em três lugares porque cada um
# é lido por uma parte diferente do Supervisor:
#   ports:         publica a porta no host  -> http://IP_DO_RASPBERRY:8090
#   ingress_port:  porta que o HA usa para abrir o painel dentro dele
#   painel.porta:  (no config.json do volume) a porta que o bot escuta
# Se você mudar painel.porta no config.json, o bot escuta nas duas portas e o
# painel continua acessível nos dois lugares.
# ---------------------------------------------------------------------------
ports:
  8090/tcp: 8090
ingress: true
ingress_port: 8090
panel_icon: mdi:newspaper-variant
panel_title: Bot de Notícias
panel_admin: true

options:
  canal_id: ""
  canais: ""
  modo_publicacao: "reserva"
  meu_numero: ""
  publicacao_gancho: "💬 Se você também aplica com drone, me conta aqui."
  llm_provedor: "groq"
  groq_api_key: ""
  groq_modelo: "qwen/qwen3.8-27b"
  resumo_diario_hora: "07:00"
  max_noticias: 5
  painel_token: ""
  notificar_ha: "true"
  dispositivo_notificacao: ""
  publicar_estado_ha: "true"
schema:
  canal_id: str?
  canais: str?
  modo_publicacao: "list(reserva|todos)"
  meu_numero: str?
  publicacao_gancho: str?
  llm_provedor: "list(groq|ha_assist|ollama|heuristica)"
  groq_api_key: str?
  groq_modelo: str?
  resumo_diario_hora: str?
  max_noticias: int(1,20)?
  painel_token: password?
  notificar_ha: bool?
  dispositivo_notificacao: str?
  publicar_estado_ha: bool?

map:
  - share:rw

# Dá acesso à API do Home Assistant (http://supervisor/core/api) e injeta a
# variável SUPERVISOR_TOKEN no container.
#   homeassistant_api -> libera o proxy /core/api do Supervisor
#   hassio_api        -> libera a API do Supervisor (addons, services...) — não usamos
hassio_api: false
homeassistant_api: true
