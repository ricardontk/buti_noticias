alias: Bot - Buscar notícias
description: Dispara a varredura normal no bot de notícias de drones de pulverização.
mode: single
sequence:
  - action: rest_command.noticias_buscar
    response_variable: resposta
  - if:
      - condition: template
        value_template: "{{ resposta['status'] != 200 }}"
    then:
      - action: persistent_notification.create
        data:
          title: "Bot de notícias"
          message: >-
            Não consegui falar com o bot (HTTP {{ resposta['status'] }}).
            Confira se o bot está rodando e se o token está certo.
      - stop: "Bot não respondeu"
  # A varredura é assíncrona: o bot responde na hora e segue trabalhando.
  - delay: "00:00:20"
  # `rest.reload` força a leitura imediata de /api/status (não espera o scan_interval).
  - action: rest.reload
